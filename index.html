<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form | Beeskilled</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Contact Sahil</h1>

            <p>
                Send me a message using the form below.
            </p>

            <form id="contactForm">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Message</label>

                <textarea
                    id="message"
                    placeholder="Enter your message"
                    required
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

            <p id="response"></p>

        </div>

    </div>


    <script>

        const API_URL =
            "https://191vinzy7e.execute-api.ap-south-1.amazonaws.com/contact";


        document
            .getElementById("contactForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const responseElement =
                    document.getElementById("response");


                const data = {

                    name:
                        document.getElementById("name").value,

                    email:
                        document.getElementById("email").value,

                    message:
                        document.getElementById("message").value

                };


                try {

                    const response =
                        await fetch(API_URL, {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify(data)

                        });


                    const result =
                        await response.json();


                    responseElement.textContent =
                        result.message;


                    if (result.success) {

                        document
                            .getElementById("contactForm")
                            .reset();

                    }

                } catch (error) {

                    responseElement.textContent =
                        "Unable to submit the form.";

                    console.error(error);

                }

            });

    </script>

</body>

</html>
